<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Matrix — Question Bank</title>
<style>
  :root{
    --accent:#4f46e5; --accent-soft:#eef2ff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f6f7fb; --card:#ffffff;
    --ok-bg:#e8f5e9; --ok-fg:#2e7d32; --warn-bg:#fff8e1; --warn-fg:#b45309;
    --bad-bg:#fdecea; --bad-fg:#c62828;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       font-size:14px;line-height:1.45}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 24px 0;position:sticky;top:0;z-index:50}
  h1{margin:0 0 2px;font-size:20px}
  .sub{color:var(--muted);margin:0 0 14px;font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .kpi.bad .v{color:var(--bad-fg)} .kpi.warn .v{color:var(--warn-fg)} .kpi.ok .v{color:var(--ok-fg)}
  nav{display:flex;gap:4px;border-bottom:none}
  nav button{background:none;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;
    padding:8px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  nav button.active{background:var(--bg);color:var(--accent);border-color:var(--line)}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 0 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .controls label{display:flex;align-items:center;gap:6px}
  .controls input[type=number]{width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .btn{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
  .btn.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .src{margin-left:auto;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-weight:600}
  main{padding:18px 24px 60px;max-width:1400px;margin:0 auto}
  .tab{display:none} .tab.active{display:block}
  h2{font-size:15px;margin:22px 0 8px}
  h2:first-child{margin-top:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;overflow:auto}
  table.grid{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  table.grid th,table.grid td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:middle;white-space:nowrap}
  table.grid th{background:#f9fafb;font-size:12px;position:sticky;top:0;z-index:5}
  table.grid th.sortable{cursor:pointer;user-select:none}
  table.grid th.sortable:hover{background:#eef2ff}
  td.num,th.num{text-align:right}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .chip.ok{background:var(--ok-bg);color:var(--ok-fg)}
  .chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .chip.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .chip.info{background:var(--accent-soft);color:var(--accent)}
  .bar{background:#eef0f4;border-radius:4px;height:10px;width:90px;display:inline-block;vertical-align:middle;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .bar>i.warn{background:#f59e0b} .bar>i.bad{background:#ef4444}
  table.matrix{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
  table.matrix th,table.matrix td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 8px;text-align:center;font-size:12.5px;min-width:52px}
  table.matrix thead th{background:#f9fafb;position:sticky;top:0;z-index:6}
  table.matrix th.rowhead,table.matrix td.rowhead{position:sticky;left:0;background:#fff;text-align:left;min-width:220px;z-index:4;border-right:2px solid var(--line)}
  table.matrix thead th.corner{z-index:7}
  table.matrix td.mcell{cursor:pointer}
  table.matrix td.mcell:hover{outline:2px solid var(--accent);outline-offset:-2px}
  table.matrix td.zero{color:#c62828;background:#fdecea;font-weight:700}
  table.matrix tfoot td{background:#f9fafb;font-weight:700}
  .legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);margin:8px 0}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
  .toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:10px;font-size:13px}
  .toolbar select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
  .chapter-row td{background:var(--accent-soft);font-weight:700}
  .toggle{cursor:pointer;color:var(--accent);font-weight:700;margin-right:6px;user-select:none}
  .gapcards{display:flex;flex-wrap:wrap;gap:10px}
  .gapcard{border:1px solid #f3c1bc;background:var(--bad-bg);border-radius:10px;padding:10px 14px;min-width:180px}
  .gapcard b{display:block;font-size:14px}
  .gapcard span{font-size:12px;color:var(--muted)}
  .combo{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;margin:3px;font-size:12px}
  .combo b{color:var(--bad-fg)}
  textarea{width:100%;min-height:230px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
           border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}
  pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;overflow:auto;font-size:12px;line-height:1.5}
  .hint{color:var(--muted);font-size:12.5px}
  .msg{margin-top:8px;font-size:13px}
  .msg.err{color:var(--bad-fg)} .msg.okmsg{color:var(--ok-fg)}
  .mix{display:inline-flex;width:90px;height:10px;border-radius:4px;overflow:hidden;background:#eef0f4;vertical-align:middle}
  .mix i{display:block;height:100%}
  .dims{font-size:11px;color:#667;white-space:nowrap}
  .scope-t{font-weight:800} .scope-c{padding-left:14px} .scope-s{padding-left:30px}
  .rdnote{font-size:12px;color:#667;margin:2px 0 10px}
  table.grid td.sec{white-space:nowrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
  .scard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:#fff;
         transition:box-shadow .15s,border-color .15s}
  .scard:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(30,64,175,.08)}
  .scard .t{font-weight:800;font-size:15px;margin-bottom:8px}
  .scard .kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:#556;margin-top:3px}
  .scard .kv b{color:#111;font-weight:700}
  .scard .hint{color:#99a;font-weight:400;font-size:11px}
  .crumbs{display:flex;gap:7px;align-items:center;font-size:13px;margin:2px 0 14px;flex-wrap:wrap}
  .crumbs a{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
  .crumbs a:hover{text-decoration:underline}
  .crumbs i{color:#99a;font-style:normal}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:10px 0 16px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .stat .v{font-size:19px;font-weight:800}
  .stat .l{font-size:10.5px;color:#667;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .dimb{display:flex;align-items:center;gap:10px;font-size:12px;margin:5px 0}
  .dimb .dl{width:120px;color:#556;text-align:right;flex:none}
  .dimb .db{flex:1;max-width:260px;height:8px;background:#eef0f4;border-radius:4px;overflow:hidden}
  .dimb .db i{display:block;height:100%;background:var(--accent)}
  .dimb .dv{width:44px;font-weight:700}
  .streamhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;margin:14px 0 2px;
              background:var(--accent-soft);border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px}
  .streamhead:hover{filter:brightness(.97)}
  .streamhead .s{font-weight:400;color:#556;font-size:12px}
  table.grid td.hc{text-align:center;font-weight:700;cursor:pointer;border:2px solid #fff;border-radius:6px}
  .legend{display:flex;gap:14px;align-items:center;font-size:11.5px;color:#556;margin:8px 0}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:4px}
  .sevfilter{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
  .sevfilter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font:inherit;font-size:12px;cursor:pointer}
  .sevfilter button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.muted{background:#eef0f4;color:#556}
  .bpfilter{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:end}
  .bpfilter label{font-size:10.5px;color:#667;display:block;text-transform:uppercase;letter-spacing:.4px}
  .bpfilter select,.bpfilter input{padding:4px 7px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12.5px;background:#fff;max-width:150px}
  table.grid tr.slrow{cursor:pointer}
  table.grid tr.slrow:hover td{background:#f6f8ff}
  .stchip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .st-available{background:#bbf7d0;color:#14532d}.st-available_with_review{background:#d9f99d;color:#3f6212}
  .st-partially_available{background:#fde68a;color:#78350f}.st-needs_review{background:#fed7aa;color:#7c2d12}
  .st-missing{background:#fecaca;color:#7f1d1d}.st-blocked_by_eligibility{background:#ddd6fe;color:#4c1d95}
  .st-no_target_configured{background:#eef0f4;color:#556}
  .excl{font-size:11.5px;color:#667}
  .candid{display:inline-block;margin:2px 3px;padding:1px 7px;background:#eef2ff;border-radius:6px;font-size:11.5px;font-family:ui-monospace,monospace}
  .gridcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:900px){.gridcols{grid-template-columns:1fr}}
  .detail-title{font-weight:700;margin:14px 0 6px;font-size:13px}
  @media print{
    header nav,.controls,#tab-data{display:none!important}
    .tab{display:block!important;page-break-after:always}
    body{background:#fff}
  }
</style>
</head>
<body>

<header>
  <h1>Question Bank — Coverage Matrix</h1>
  <p class="sub">Chapters × question type × difficulty × marks, with topic drill-down, quality flags and gap analysis.</p>
  <div class="cards" id="cards"></div>
  <nav id="tabs"></nav>
  <div class="controls">
    <label>Min questions / chapter <input type="number" id="chapterMin" min="0" value="30"></label>
    <label>Target / cell (type × difficulty) <input type="number" id="cellTarget" min="0" value="3"></label>
    <button class="btn ghost" id="exportBtn">Export CSV</button>
    <span class="src" id="sourceLabel"></span>
  </div>
</header>

<main>
  <section id="tab-explorer"  class="tab"></section>
  <section id="tab-bp"        class="tab"></section>
  <section id="tab-plan"      class="tab"></section>
  <section id="tab-chapters"  class="tab"></section>
  <section id="tab-matrix"    class="tab"></section>
  <section id="tab-data"      class="tab"></section>
</main>

<script id="logic">
/* ============================================================
   Coverage Matrix — pure logic (no DOM access; unit-testable)
   ============================================================ */
'use strict';

var DIFF_ORDER = ['Easy', 'Medium', 'Hard'];

var ALIASES = {
  chapter_code: ['chapter_code','chaptercode','code','ch_code','chapter_no','chapter_number'],
  chapter_name: ['chapter_name','chaptername','chapter','chapter_title'],
  topic_name:   ['topic_name','topicname','topic','topic_title','subtopic'],
  question_type:['question_type','questiontype','type','qtype','question_format','format'],
  difficulty:   ['difficulty','level','difficulty_level','diff'],
  marks:        ['marks','mark','weight','max_marks','points'],
  count:        ['count','total','questions','num_questions','q_count','question_count','n'],
  with_answer:  ['with_answer','with_answers','answered','answers','has_answer','answer_present'],
  needs_review: ['needs_review','review','flag_review','to_review'],
  with_diagram: ['with_diagram','diagrams','diagram','has_diagram'],
  target:       ['target','goal','min_target','expected']
};

function normKey(k){ return String(k).trim().toLowerCase().replace(/[\s\-]+/g,'_'); }

function mapKey(k){
  var n = normKey(k);
  for (var field in ALIASES){ if (ALIASES[field].indexOf(n) !== -1) return field; }
  return null;
}

function toNum(v){
  if (v === null || v === undefined || v === '') return 0;
  var n = Number(String(v).replace(/,/g,''));
  return isFinite(n) ? n : 0;
}

function titleCase(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function fmtMarks(m){
  if (m === null || m === undefined || m === '') return '—';
  var n = Number(m);
  if (isFinite(n)) return String(parseFloat(n.toFixed(2)));
  return String(m);
}

function normalizeRow(obj){
  var out = {chapter_code:'', chapter_name:'', topic_name:'', question_type:'', difficulty:'',
             marks:'', count:1, with_answer:0, needs_review:0, with_diagram:0, target:null};
  for (var k in obj){
    var f = mapKey(k);
    if (!f) continue;
    var v = obj[k];
    if (f === 'count' || f === 'with_answer' || f === 'needs_review' || f === 'with_diagram'){
      out[f] = toNum(v);
    } else if (f === 'target'){
      out[f] = (v === '' || v === null || v === undefined) ? null : toNum(v);
    } else {
      out[f] = String(v === null || v === undefined ? '' : v).trim();
    }
  }
  if (out.difficulty) out.difficulty = titleCase(out.difficulty.toLowerCase());
  if (out.marks !== '') out.marks = fmtMarks(out.marks);
  if (!out.chapter_name) out.chapter_name = out.chapter_code;
  if (!out.chapter_code) out.chapter_code = out.chapter_name;
  if (!out.question_type) out.question_type = 'Unspecified';
  if (!out.difficulty) out.difficulty = 'Unspecified';
  if (!out.topic_name) out.topic_name = '(no topic)';
  return out;
}

function normalizeRows(list){ return (list || []).map(normalizeRow); }

function parseCSV(text){
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ''; });
  if (!lines.length) return [];
  var header = lines[0];
  var counts = {',':0, '\t':0, ';':0, '|':0};
  for (var i = 0; i < header.length; i++){ if (counts[header[i]] !== undefined) counts[header[i]]++; }
  var delim = ',', best = -1;
  for (var d in counts){ if (counts[d] > best){ best = counts[d]; delim = d; } }
  function splitLine(line){
    var out = [], cur = '', inQ = false;
    for (var j = 0; j < line.length; j++){
      var c = line[j];
      if (inQ){
        if (c === '"'){ if (line[j+1] === '"'){ cur += '"'; j++; } else inQ = false; }
        else cur += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === delim){ out.push(cur); cur = ''; }
        else cur += c;
      }
    }
    out.push(cur);
    return out;
  }
  var headers = splitLine(lines[0]);
  var rows = [];
  for (var r = 1; r < lines.length; r++){
    var cells = splitLine(lines[r]);
    var obj = {};
    for (var c2 = 0; c2 < headers.length; c2++) obj[headers[c2]] = cells[c2];
    rows.push(obj);
  }
  return rows;
}

function parseInput(text){
  var t = String(text || '').trim();
  if (!t) return [];
  if (t.charAt(0) === '[' || t.charAt(0) === '{'){
    var data = JSON.parse(t);
    if (!Array.isArray(data)){
      if (data && Array.isArray(data.rows)) data = data.rows;
      else data = [data];
    }
    return data;
  }
  return parseCSV(t);
}

function newBucket(){
  return {total:0, with_answer:0, needs_review:0, with_diagram:0,
          byDifficulty:{}, byType:{}, byMarks:{}};
}
function addToBucket(b, row){
  b.total += row.count;
  b.with_answer += row.with_answer;
  b.needs_review += row.needs_review;
  b.with_diagram += row.with_diagram;
  b.byDifficulty[row.difficulty] = (b.byDifficulty[row.difficulty] || 0) + row.count;
  b.byType[row.question_type] = (b.byType[row.question_type] || 0) + row.count;
  var mk = row.marks === '' ? '—' : row.marks;
  b.byMarks[mk] = (b.byMarks[mk] || 0) + row.count;
}

function sortDifficultyKeys(keys){
  return keys.slice().sort(function(a, b){
    var ia = DIFF_ORDER.indexOf(a), ib = DIFF_ORDER.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
}

function sortMarksKeys(keys){
  return keys.slice().sort(function(a, b){
    var na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    if (!isNaN(na)) return -1;
    if (!isNaN(nb)) return 1;
    return a.localeCompare(b);
  });
}

function aggregate(rows){
  var chapters = {}, chapterOrder = [], topics = {};
  var types = {}, diffs = {}, marks = {};
  rows.forEach(function(r){
    var ck = r.chapter_code || r.chapter_name;
    if (!chapters[ck]){
      chapters[ck] = Object.assign({key:ck, code:r.chapter_code, name:r.chapter_name}, newBucket());
      chapterOrder.push(ck);
    }
    addToBucket(chapters[ck], r);
    types[r.question_type] = 1;
    diffs[r.difficulty] = 1;
    marks[r.marks === '' ? '—' : r.marks] = 1;
    var tk = ck + '\u0000' + r.topic_name;
    if (!topics[tk]){
      topics[tk] = Object.assign({key:tk, chapterKey:ck, chapterCode:chapters[ck].code,
                                  chapterName:chapters[ck].name, name:r.topic_name}, newBucket());
    }
    addToBucket(topics[tk], r);
  });
  chapterOrder.sort(function(a,b){
    return chapters[a].code.localeCompare(chapters[b].code, undefined, {numeric:true});
  });
  var chapterList = chapterOrder.map(function(k){ return chapters[k]; });
  var topicList = Object.keys(topics).map(function(k){ return topics[k]; });
  topicList.sort(function(a,b){
    var ca = chapters[a.chapterKey].code.localeCompare(chapters[b.chapterKey].code, undefined, {numeric:true});
    if (ca !== 0) return ca;
    return a.name.localeCompare(b.name);
  });
  return {
    chapters: chapterList,
    topics: topicList,
    types: Object.keys(types).sort(),
    difficulties: sortDifficultyKeys(Object.keys(diffs)),
    marksList: sortMarksKeys(Object.keys(marks)),
    total: rows.reduce(function(s,r){ return s + r.count; }, 0),
    withAnswer: rows.reduce(function(s,r){ return s + r.with_answer; }, 0),
    needsReview: rows.reduce(function(s,r){ return s + r.needs_review; }, 0),
    withDiagram: rows.reduce(function(s,r){ return s + r.with_diagram; }, 0)
  };
}

function pivotRowKey(row, rowDim){
  if (rowDim === 'topic') return row.chapter_code + '\u0000' + row.topic_name;
  return row.chapter_code;
}
function pivotColKey(row, colDim){
  return colDim.split('|').map(function(d){
    if (d === 'marks') return row.marks === '' ? '—' : row.marks;
    return row[d];
  }).join(' · ');
}
function colSorter(colDim){
  var dims = colDim.split('|');
  if (dims.length === 1 && dims[0] === 'difficulty') return sortDifficultyKeys;
  if (dims.length === 1 && dims[0] === 'marks') return sortMarksKeys;
  return function(keys){ return keys.slice().sort(); };
}

function buildPivot(rows, rowDim, colDim){
  var cell = {}, rowInfo = {}, colSet = {};
  rows.forEach(function(r){
    var rk = pivotRowKey(r, rowDim), ck = pivotColKey(r, colDim);
    if (!cell[rk]) cell[rk] = {};
    cell[rk][ck] = (cell[rk][ck] || 0) + r.count;
    colSet[ck] = 1;
    if (!rowInfo[rk]){
      rowInfo[rk] = {key:rk};
      if (rowDim === 'topic'){
        rowInfo[rk].label = r.topic_name;
        rowInfo[rk].groupLabel = r.chapter_code + ' — ' + r.chapter_name;
        rowInfo[rk].sortKey = r.chapter_code + '\u0000' + r.topic_name;
      } else {
        rowInfo[rk].label = r.chapter_code + ' — ' + r.chapter_name;
        rowInfo[rk].sortKey = r.chapter_code;
      }
    }
  });
  var cols = colSorter(colDim)(Object.keys(colSet));
  var list = Object.keys(rowInfo).map(function(k){
    var o = rowInfo[k];
    o.cells = cell[k] || {};
    o.total = cols.reduce(function(s,c){ return s + (o.cells[c] || 0); }, 0);
    return o;
  });
  list.sort(function(a,b){ return a.sortKey.localeCompare(b.sortKey, undefined, {numeric:true}); });
  var grand = list.reduce(function(s,o){ return s + o.total; }, 0);
  return {rows:list, cols:cols, grand:grand, rowDim:rowDim, colDim:colDim};
}

/* ---------- deterministic sample data (demo) ---------- */
function mulberry32(seed){
  var t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    var x = t;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

function makeSampleData(){
  var rnd = mulberry32(20261005);
  var chapters = [
    {code:'CH01', name:'Number Systems',        topics:['Real Numbers','Laws of Exponents','Surds & Simplification']},
    {code:'CH02', name:'Polynomials',           topics:['Zeros of a Polynomial','Division Algorithm','Factor Theorem']},
    {code:'CH03', name:'Linear Equations',      topics:['Pairs of Linear Equations','Word Problems','Graphical Method']},
    {code:'CH04', name:'Quadratic Equations',   topics:['Factorisation','Quadratic Formula','Nature of Roots','Word Problems']},
    {code:'CH05', name:'Arithmetic Progressions',topics:['nth Term','Sum of n Terms','Word Problems']},
    {code:'CH06', name:'Triangles',             topics:['Similarity Criteria','Basic Proportionality Theorem','Pythagoras Theorem']},
    {code:'CH07', name:'Coordinate Geometry',   topics:['Distance Formula','Section Formula','Area of Triangle']},
    {code:'CH08', name:'Trigonometry',          topics:['Trigonometric Ratios','Identities','Heights & Distances']},
    {code:'CH09', name:'Statistics',            topics:['Mean of Grouped Data','Median & Mode','Ogive']},
    {code:'CH10', name:'Vectors & 3D Geometry', topics:['Vector Basics','Direction Cosines']}
  ];
  var types = [
    {name:'MCQ',          marks:[1]},
    {name:'Short Answer', marks:[2,3]},
    {name:'Long Answer',  marks:[5]},
    {name:'Case-Based',   marks:[4]}
  ];
  var diffs = ['Easy','Medium','Hard'];
  // demo scopes: CH01–05 → CBSE Class 10 Mathematics · CH06–08 → Class 10 Science · CH09–10 → Class 11 Physics
  var scopes = [['MAT',10],['MAT',10],['MAT',10],['MAT',10],['MAT',10],
                ['SCI',10],['SCI',10],['SCI',10],['PHY',11],['PHY',11]];
  // separate deterministic RNG for the usability extras — keeps the main stream untouched
  var rnd2 = (function(){ var x = 20261005; return function(){ x = (x * 1103515245 + 12345) % 2147483648; return x / 2147483648; }; })();
  var rows = [];
  chapters.forEach(function(ch, ci){
    var sparse = (ci === 8);   // CH09 Statistics: deliberately thin
    var empty  = (ci === 9);   // CH10: deliberately no questions yet
    ch.topics.forEach(function(topic){
      types.forEach(function(t){
        t.marks.forEach(function(m){
          diffs.forEach(function(d){
            var count;
            if (empty) count = 0;
            else if (sparse) count = rnd() < 0.6 ? 0 : Math.floor(rnd()*3) + 1;
            else count = rnd() < 0.12 ? 0 : Math.floor(rnd() * (d==='Easy' ? 10 : d==='Medium' ? 7 : 4)) + 1;
            var withAnswer = Math.min(count, Math.round(count * (0.7 + rnd()*0.3)));
            var needsReview = count ? Math.floor(rnd() * Math.max(1, Math.round(count*0.25))) : 0;
            var withDiagram = (t.name==='MCQ' || t.name==='Case-Based')
              ? Math.floor(rnd() * (count > 2 ? 3 : 1))
              : (rnd() < 0.3 ? 1 : 0);
            withDiagram = Math.min(withDiagram, count);
            var usable = Math.max(0, withAnswer - needsReview);
            var unused = Math.floor(rnd2() * (usable + 1));
            rows.push({chapter_code:ch.code, chapter_name:ch.name, topic_name:topic,
                       question_type:t.name, difficulty:d, marks:m, count:count,
                       with_answer:withAnswer, needs_review:needsReview, with_diagram:withDiagram,
                       board:'CBSE', class:scopes[ci][1], subject_code:scopes[ci][0],
                       usable:usable, unused:unused});
          });
        });
      });
    });
  });
  return rows;
}

  bp.unresolved_chapters.forEach(function (u){
    errors.push({ code: 'unresolved_chapter', slot_id: u.slot_id, message: 'slot references chapter "' + u.ref + '" missing from chapter_pool' });
  });
  // totals reconciliation
  if (bp.totals.declared_marks !== null && bp.totals.declared_marks !== bp.totals.marks)
    errors.push({ code: 'marks_total_mismatch', message: 'declared total ' + bp.totals.declared_marks + ' marks, slots sum to ' + bp.totals.marks });
  if (bp.totals.declared_slots !== null && bp.totals.declared_slots !== bp.totals.slots)
    errors.push({ code: 'slot_count_mismatch', message: 'declared ' + bp.totals.declared_slots + ' slots, matrix has ' + bp.totals.slots });
  Object.keys(bp.sections).forEach(function (n){
    var sc = bp.sections[n];
    if (sc.declared_marks !== null && sc.declared_marks !== sc.marks)
      errors.push({ code: 'section_marks_mismatch', section: n, message: 'section ' + n + ': declared ' + sc.declared_marks + ' marks, slots sum to ' + sc.marks });
    if (sc.declared_slots !== null && sc.declared_slots !== sc.slots)
      errors.push({ code: 'section_slots_mismatch', section: n, message: 'section ' + n + ': declared ' + sc.declared_slots + ' slots, found ' + sc.slots });
  });
  if (bp.chapter_pool_derived) warnings.push({ code: 'pool_derived', message: 'chapter weightage is derived from slot marks (no chapter_pool supplied)' });
  return { errors: errors, warnings: warnings };
}

// ---------- slot × bank matching ----------
// rows: slotbank-shaped aggregates, one per distinct dimension combo:
// { board, class, subject_code, chapter_code, chapter, question_type, marks,
//   difficulty_norm, cognitive?, structure?, diagram_ok?, n_versions, n_usable,
//   n_questions?, n_families?, n_no_answer?, n_bad_status?, n_review?,
//   sample_ids?: [] , raw? }
// opts: { papers?: n (multiplies target_count), filters?: {...} UI-side narrowing }
function slotMatchesRow(sl, r, opts){
  opts = opts || {};
  var f = opts.filters || {};
  if (f.question_type && normKey(r.question_type) !== normKey(f.question_type)) return false;
  if (f.marks && toInt(r.marks) !== toInt(f.marks)) return false;
  if (f.difficulty && normDifficulty(r.difficulty_norm) !== normDifficulty(f.difficulty)) return false;
  if (sl.chapter_code && r.chapter_code && sl.chapter_code !== r.chapter_code) return false;
  if (!sl.chapter_code && sl.chapter && r.chapter && normKey(sl.chapter) !== normKey(r.chapter)) return false;
  if (sl.question_type && r.question_type && normKey(sl.question_type) !== normKey(r.question_type)) return false;
  if (sl.marks != null && toInt(r.marks) !== sl.marks) return false;   // marks alone NEVER qualifies a question
  if (sl.difficulty){
    var rd = normDifficulty(r.difficulty_norm || r.difficulty) || String(r.difficulty || '').trim();
    if (normKey(rd) !== normKey(sl.difficulty_raw || sl.difficulty)) return false;
  }
  if (sl.cognitive && r.cognitive != null && normKey(String(sl.cognitive).replace(' (source-defined)','')) !== normKey(r.cognitive)) return false;
  if (sl.structure && r.structure != null && normKey(sl.structure) !== normKey(r.structure)) return false;
  if (sl.diagram_required === true && r.diagram_ok != null && r.diagram_ok === false) return false;
  return true;
}
function matchSlots(bp, rows, opts){
  opts = opts || {};
  var papers = Math.max(1, toInt(opts.papers) || 1);
  var perSlot = [], rowHit = {};
  (bp.slots || []).forEach(function (sl){
    var hits = [], slotMatch = {};
    rows.forEach(function (r, ri){
      if (!slotMatchesRow(sl, r, opts)) return;
      hits.push({ ri: ri, row: r });
      slotMatch[ri] = 1;
      rowHit[ri] = 1;
    });
    var versions = 0, usable = 0, noAns = 0, badStatus = 0, review = 0,
        q = 0, fam = 0, ids = [];
    hits.forEach(function (h){
      var r = h.row;
      versions += toInt(r.n_versions != null ? r.n_versions : r.count) || 0;
      usable   += toInt(r.n_usable != null ? r.n_usable : r.usable) || 0;
      noAns    += toInt(r.n_no_answer) || 0;
      badStatus+= toInt(r.n_bad_status) || 0;
      review   += toInt(r.n_review) || 0;
      q += toInt(r.n_questions) || 0; fam += toInt(r.n_families) || 0;
      if (Array.isArray(r.sample_ids)){ var cap = toInt(opts.idCap) || 24; r.sample_ids.forEach(function (v){ if (ids.length < cap) ids.push(v); }); }
    });
    var target = (toInt(sl.target_count) || 1) * papers;
    var status, shortfall = Math.max(0, target - usable);
    if (!hits.length) status = 'missing';                       // nothing even matches the shape
    else if (usable <= 0) status = versions > 0 ? 'blocked_by_eligibility' : 'missing';
    else if (usable >= target) status = review > usable * 0.5 && review > 0 ? 'needs_review' : 'available';
    else status = 'partially_available';
    if (usable > 0 && review > 0 && status === 'available') status = 'available_with_review';
    // near-misses: rows that share the chapter but fail exactly one constraint —
    // this is the "why didn't they qualify" panel, computed honestly from counts.
    var near = { versions: 0, reasons: {} };
    rows.forEach(function (r, ri){
      if (slotMatch[ri]) return;
      var sameChapter = (sl.chapter_code && r.chapter_code) ? sl.chapter_code === r.chapter_code
                      : (sl.chapter ? normKey(sl.chapter) === normKey(r.chapter) : true);
      if (!sameChapter) return;
      var fail = null;
      if (sl.question_type && r.question_type && normKey(sl.question_type) !== normKey(r.question_type)) fail = 'question_type ≠ ' + sl.question_type;
      else if (sl.marks != null && toInt(r.marks) !== sl.marks) fail = 'marks ≠ ' + sl.marks;
      else if (sl.difficulty && normDifficulty(r.difficulty_norm || r.difficulty) !== normKey(sl.difficulty_raw || sl.difficulty)) fail = 'difficulty ≠ ' + sl.difficulty;
      else if (sl.cognitive && r.cognitive != null && normKey(String(sl.cognitive).replace(' (source-defined)','')) !== normKey(r.cognitive)) fail = 'cognitive ≠ ' + sl.cognitive;
      else if (sl.structure && r.structure != null && normKey(sl.structure) !== normKey(r.structure)) fail = 'structure ≠ ' + sl.structure;
      else if (sl.diagram_required === true && r.diagram_ok === false) fail = 'diagram missing';
      if (fail){ near.versions += toInt(r.n_versions) || 0; near.reasons[fail] = (near.reasons[fail] || 0) + (toInt(r.n_versions) || 0); }
    });
    perSlot.push({
      slot_id: sl.slot_id, section: sl.section, position: sl.position,
      near_misses: near,
      chapter_code: sl.chapter_code || sl.chapter, marks: sl.marks,
      question_type: sl.question_type, difficulty: sl.difficulty,
      cognitive: sl.cognitive, structure: sl.structure,
      subparts: sl.subparts, internal_choice: sl.internal_choice,
      diagram_required: sl.diagram_required, accessibility: sl.accessibility,
      target_count: target,
      candidate_versions: versions, eligible_versions: usable,
      distinct_questions: q, distinct_families: fam,
      status: status, shortfall: shortfall,
      surplus: Math.max(0, usable - target),
      candidates: ids,
      excluded: { missing_answer: noAns, bad_status: badStatus, needs_review: review },
      has_constraints_left: !!(sl.cognitive || sl.structure || sl.diagram_required)
    });
  });
  var matchedRows = rows.filter(function (r, ri){ return rowHit[ri]; });
  var sum = function (k){ return matchedRows.reduce(function (a, r){ return a + (toInt(r[k] != null ? r[k] : (k === 'n_versions' || k === 'count') ? r.count : 0) || 0); }, 0); };
  var filled = perSlot.filter(function (r){ return r.eligible_versions > 0; }).length;
  var compare = {
    target_slots: perSlot.length,
    filled_slots: filled,
    shortfall_slots: perSlot.length - filled,
    blocked_slots: perSlot.filter(function (r){ return r.status === 'blocked_by_eligibility'; }).length,
    // union across slots — rows are disjoint dimension combos, so no double count:
    eligible_candidates: sum('n_usable') ,
    eligible_versions: sum('n_usable'),
    raw_versions: sum('n_versions'),
    distinct_questions_approx: matchedRows.length ? matchedRows.reduce(function (a, r){ return a + (toInt(r.n_questions) || 0); }, 0) : null,
    distinct_families_approx: matchedRows.length ? matchedRows.reduce(function (a, r){ return a + (toInt(r.n_families) || 0); }, 0) : null,
    coverage_pct: perSlot.length ? Math.round(1000 * filled / perSlot.length) / 10 : null,
    target_marks: bp.totals ? bp.totals.marks : null,
    usable_marks: 0
  };
  compare.usable_marks = perSlot.reduce(function (a, r){ return a + (r.marks || 0) * Math.min(r.eligible_versions, r.target_count); }, 0);
  return { per_slot: perSlot, compare: compare };
}

// ---------- blueprint-derived chapter weightage ----------
// derived ONLY from the normalized slots (+ declared pool marks as a cross-check).
// Labeled in the UI as "derived from the stored blueprint — not independently
// verified official CBSE weightage".
function chapterWeightage(bp){
  var per = {};
  (bp.slots || []).forEach(function (sl){
    var key = sl.chapter_code || sl.chapter || '—';
    var o = per[key] || (per[key] = { chapter_code: sl.chapter_code, chapter: sl.chapter || key,
      target_marks: 0, slots: 0, declared_pool_marks: bp.chapters[key] ? bp.chapters[key].declared_marks : null });
    o.target_marks += sl.marks || 0; o.slots++;
  });
  var total = bp.totals ? (bp.totals.marks || 1) : 1;
  var rows = Object.keys(per).map(function (k){
    var o = per[k];
    return Object.assign({}, o, {
      pct: Math.round(1000 * o.target_marks / total) / 10,
      pool_conflict: o.declared_pool_marks !== null && o.declared_pool_marks !== o.target_marks
    });
  }).sort(function (a, b){ return b.target_marks - a.target_marks || String(a.chapter).localeCompare(String(b.chapter)); });
  return { total_marks: total, chapters: rows, conflicts: rows.filter(function (r){ return r.pool_conflict; }) };
}

// ---------- deterministic full-syllabus scaling ----------
// Largest-remainder with a fixed tie order; guarantees the scaled marks sum to
// exactly `paperMarks`. For mode 'partial' | 'custom' the blueprint weightage is
// NOT enforced — the caller's selected chapters / planner targets pass through.
function scaleChapterTargets(bp, paperMarks, opts){
  opts = opts || {};
  var mode = opts.mode || 'full';
  if (mode !== 'full'){
    return { mode: mode, enforced: false,
      chapters: (opts.selectedChapters || []).map(function (c){ return Object.assign({}, c); }),
      note: 'partial/custom papers follow the dynamic planner targets; full-syllabus blueprint weightage is not enforced' };
  }
  var cw = chapterWeightage(bp);
  var quota = (paperMarks || cw.total_marks) / (cw.total_marks || 1);
  var items = cw.chapters.map(function (c){
    var exact = c.target_marks * quota;
    return { chapter_code: c.chapter_code, chapter: c.chapter, target_marks: c.target_marks, exact: exact,
             base: Math.floor(exact), rem: exact - Math.floor(exact) };
  });
  var allocated = items.reduce(function (a, x){ return a + x.base; }, 0);
  var seats = (paperMarks || 0) - allocated;
  var order = items.slice().sort(function (a, b){
    return (b.rem - a.rem) || (b.target_marks || 0) - (a.target_marks || 0) || String(a.chapter_code).localeCompare(String(b.chapter_code));
  });
  var ranked = items.slice().sort(function (a, b){
    return (b.rem - a.rem) || (b.exact - a.exact) || String(a.chapter_code).localeCompare(String(b.chapter_code));
  });
  for (var i = 0; i < seats && ranked.length; i++) ranked[i % ranked.length].base += 1;
  var out = order.length ? items.map(function (x){
    return { chapter_code: x.chapter_code, chapter: x.chapter, target_marks: x.target_marks, scaled_marks: Math.max(0, x.base) };
  }) : [];
  var sum = out.reduce(function (a, x){ return a + x.scaled_marks; }, 0);
  // safety net: exact totals are a hard contract; shave/extend deterministically
  var si = 0;
  while (sum > paperMarks && si < out.length){ var j = si++ % out.length; if (out[j].scaled_marks > 0){ out[j].scaled_marks--; sum--; } }
  while (sum < paperMarks && si < out.length * 4){ var k = si++ % out.length; out[k].scaled_marks++; sum++; }
  return { mode: 'full', enforced: true, paper_marks: paperMarks, factor: quota, chapters: out, sum: sum };
}

// ---------- deterministic fixture: CBSE Class XII Mathematics master blueprint ----------
// Built ONLY from the acceptance numbers in the product spec (38 slots / 80 marks /
// 13 chapters / A20 B10 C18 D20 E12 / chapter marks). This is a TEST FIXTURE and a
// demo dataset — it is clearly labeled as such wherever it is rendered, and it is
// NOT presented as a copy of the live blueprints row.
function makeMasterFixture(){
  var chs = [
    ['M12-RF','Relations and Functions',6],   ['M12-ITF','Inverse Trigonometric Functions',2],
    ['M12-MT','Matrices',4],                  ['M12-DET','Determinants',6],
    ['M12-CD','Continuity and Differentiability',11], ['M12-AOD','Applications of Derivatives',7],
    ['M12-INT','Integrals',8],                ['M12-AI','Applications of the Integrals',4],
    ['M12-DE','Differential Equations',5],    ['M12-VEC','Vectors',4],
    ['M12-3DG','Three-Dimensional Geometry',10], ['M12-LPP','Linear Programming',5],
    ['M12-PRO','Probability',8]
  ];
  // chapter → [ [marks, type], … ]  (sums reconcile to the chapter marks above)
  var alloc = {
    'M12-RF': [[5,'LA'],[1,'MCQ']],
    'M12-ITF': [[1,'MCQ'],[1,'Assertion-Reason']],
    'M12-MT': [[4,'Case-Based']],
    'M12-DET': [[3,'Short Answer'],[3,'Short Answer']],
    'M12-CD': [[5,'LA'],[3,'Short Answer'],[3,'Short Answer']],
    'M12-AOD': [[3,'Short Answer'],[2,'Short Answer'],[2,'Short Answer']],
    'M12-INT': [[5,'LA'],[2,'Short Answer'],[1,'MCQ']],
    'M12-AI': [[4,'Case-Based']],
    'M12-DE': [[1,'MCQ'],[1,'MCQ'],[1,'MCQ'],[1,'MCQ'],[1,'MCQ']],
    'M12-VEC': [[1,'Assertion-Reason'],[1,'Assertion-Reason'],[1,'MCQ'],[1,'MCQ']],
    'M12-3DG': [[5,'LA'],[3,'Short Answer'],[2,'Short Answer']],
    'M12-LPP': [[1,'MCQ'],[1,'MCQ'],[1,'MCQ'],[1,'Assertion-Reason'],[1,'MCQ']],
    'M12-PRO': [[4,'Case-Based'],[2,'Short Answer'],[1,'MCQ'],[1,'MCQ']]
  };
  var sectionOf = { 1: 'A', 2: 'B', 3: 'C', 5: 'D', 4: 'E' };
  var slots = [], n = 0;
  chs.forEach(function (c){
    (alloc[c[0]] || []).forEach(function (a){
      n++;
      var sl = { slot_id: 'S' + c[0].slice(1) + '-' + n, section: sectionOf[a[0]], question_number: n,
                 chapter_code: c[0], chapter: c[1], marks: a[0], question_type: a[1], target_count: 1 };
      // representative extras so preservation + constraint paths are exercised
      if (a[1] === 'LA') { sl.subparts = 3; sl.internal_choice = { type: 'either-or', alt_marks: a[0] }; sl.difficulty = 'hard'; }
      if (a[1] === 'Case-Based') { sl.subparts = 4; sl.structure_type = 'case-study'; sl.cognitive_level = 'Apply'; }
      if (a[1] === 'Assertion-Reason') sl.cognitive_level = 'understand';
      if (c[0] === 'M12-INT' && a[1] === 'MCQ') sl.diagram_required = false, sl.cbse_note = 'fixture demo of unknown-field preservation';
      slots.push(sl);
    });
  });
  return {
    blueprint_id: 'CBSE-C12-MAT-041-MASTER-v1',

    schema_version: 'mytst-blueprint-v1',
    matrix: { slots: slots },
    chapter_pool: chs.map(function (c){ return { chapter_code: c[0], name: c[1], target_marks: c[2] }; }),
    rules: {
      status: 'published', published: true,
      identity: { board: 'CBSE', class: 12, subject: 'Mathematics', subject_code: 'MAT',
                  subject_number: '041', name: 'MASTER', version: 'v1',
                  curriculum_version: 'NCERT-2025-26' },
      totals: { marks: 80, slots: 38,
                sections: { A: { marks: 20, slots: 20 }, B: { marks: 10, slots: 5 },
                            C: { marks: 18, slots: 6 }, D: { marks: 20, slots: 4 }, E: { marks: 12, slots: 3 } } },
      provenance: { source_filename: 'fixture — built from the product spec acceptance table',
                    source_checksum: 'sha256:FIXTURE' }

}

  return {
    normalizeBlueprint: normalizeBlueprint,
    validateBlueprint: validateBlueprint,
    matchSlots: matchSlots,
    chapterWeightage: chapterWeightage,
    scaleChapterTargets: scaleChapterTargets,
    makeMasterFixture: makeMasterFixture,
    parseId: parseId, normDifficulty: normDifficulty, normKey: normKey,
    normEq: function (a, b) { return normKey(a) === normKey(b); }

<script id="ui">
'use strict';
(function(){

  var state = {
    rows: [], raw: [], server: {}, source: '', agg: null, active: 'explorer',
    pivot: {rowDim:'chapter', colDim:'question_type|difficulty'},
    opts: {chapterMin:30, cellTarget:3},
    sort: {}, selectedCell: null,
    nav: {board: null, class: null, stream: null, subject: null, chapter: null},
    planSev: 'ALL', _navq: [], lastHeat: null, lastPlan: null,
    bpSel: null, bpDemo: false, bpOpenSlot: null,
    bpFilters: {question_type:'', marks:'', difficulty:'', cognitive:'', structure:'', diagram:'', review:''},
    bpScale: {marks: '', mode: 'full'}
  };

  var TABS = [
    ['explorer','Explorer'], ['bp','Blueprint'], ['plan','Add / Missing'],
    ['chapters','Chapters'], ['matrix','Matrix'], ['data','Data']
  ];

  /* ---------------- KPI strip (global) ---------------- */
  function renderCards(){
    var rd = readinessRows();
    var brd = rd.filter(function(r){ return r.lvl === 'board'; });
    if (!brd.length) brd = [{total:0, usable:0, ideal_healthy:0, capacity_papers:null}];
    var S = function(k){ return brd.reduce(function(a, r){ return a + (+r[k] || 0); }, 0); };
    var caps = brd.map(function(r){ return r.capacity_papers; }).filter(function(v){ return v != null; });

    var g = findGaps(state.rows, a, state.opts);

    var minCap = caps.length ? Math.min.apply(null, caps) : null;
    var defs = [
      ['Questions', S('total'), ''],
      ['Usable', S('usable'), ''],
      ['Coverage of blueprint', ideal ? Math.round(100 * S('usable') / ideal) + '%' : '—', ''],
      ['Disjoint papers (min)', minCap == null ? '—' : minCap + ' 📄', minCap != null && minCap < RD_GOALS.healthy ? 'warn' : 'ok'],
      ['Empty chapters', g.emptyChapters.length, g.emptyChapters.length ? 'bad' : 'ok']
    ];
    $('cards').innerHTML = defs.map(function(d){
      return '<div class="kpi ' + d[2] + '"><div class="v">' + esc(d[1]) + '</div><div class="l">' + esc(d[0]) + '</div></div>';
    }).join('');
  }

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function mix(a,b,t){
    return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)];
  }
  function heat(n, target){
    if (!n) return '#fdecea';
    var t = Math.min(n / Math.max(target,1), 1.5) / 1.5;
    var c = t < 0.5 ? mix([255,205,178],[255,245,157], t/0.5)

    return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  }
  function pct(a,b){ return b ? Math.round(100*a/b) + '%' : '—'; }
  function distText(map, order){
    var keys = order && order.length
      ? order.filter(function(k){ return map[k]; })

  }

  /* ---------------- generic sortable table ---------------- */
  function buildTable(tableId, cols, rows, opts){
    opts = opts || {};

    var st = state.sort[tableId];
    if (st.key){

        var a = x[st.key], b = y[st.key];

      });

    cols.forEach(function(c){

    });
    h += '</tr></thead><tbody>';
    rows.forEach(function(r){
      h += '<tr' + (opts.rowClass ? ' class="' + opts.rowClass(r) + '"' : '') + '>';
      cols.forEach(function(c){
        var v = c.render ? c.render(r) : esc(r[c.key]);

  function wireSort(container, rerender){

  }

  /* ---------------- Overview tab ---------------- */
  function overviewRows(){
    return state.agg.chapters.map(function(ch){
      var r = {

  }
  function overviewCols(){
    var cols = [{label:'Chapter', key:'chapter'}];
    cols.push({label:'Questions', key:'total', cls:'num', render:function(r){ return barHtml(r.total); }});
    state.agg.difficulties.forEach(function(d){
      cols.push({label:d, key:'d_' + d, cls:'num'});
    });
    state.agg.types.forEach(function(t){

  }
  function renderOverview(){

  /* ---------------- Matrix tab ---------------- */
  function renderMatrix(){

  function showCellDetail(pv){

      matches.forEach(function(m){

             '<td class="num">' + m.needs_review + '</td><td class="num">' + m.with_diagram + '</td></tr>';

  /* ---------------- readiness (paper-generation) + class coverage ---------------- */
  var RD_SLOTS = [
    {t:'MCQ', m:1, p:14, f:3, d:10},
    {t:'Assertion-Reason', m:1, p:4, f:3, d:6},
    {t:'Very Short Answer', m:2, p:5, f:3, d:5},
    {t:'Short Answer', m:2, p:5, f:3, d:5},
    {t:'Short Answer', m:3, p:6, f:3, d:5},
    {t:'Case-Based', m:4, p:4, f:3, d:4},
    {t:'Long Answer', m:5, p:4, f:3, d:4}
  ];
  var RD_GOALS = {healthy:10, strong:25, viable:1, de:30, dm:40, dh:30, fresh:50};
  var RD_W = {cur:0.30, marks:0.20, types:0.20, diff:0.15, rot:0.15};
  function rdNorm(d){ return String(d || '').trim().toLowerCase(); }
  function rdUsable(r){ return r.usable != null ? toNum(r.usable) : (r.with_answer != null ? toNum(r.with_answer) : toNum(r.count)); }
  function rdFresh(r){ return r.unused_usable != null ? toNum(r.unused_usable) : (r.unused != null ? Math.min(toNum(r.unused), rdUsable(r)) : null); }
  function rdStream(code){
    var m = {Science:['PHY','CHE','BIO','MAT','MATH','CS','IT','SCI'], Commerce:['ACC','BST','ECO','ACF'],
             Humanities:['HIS','POL','GEO','PSY','SOC','HUM'], Languages:['ENG','HIN','ENF','HNE']};
    for (var k in m){ if (m[k].indexOf(code) >= 0) return k; }
    return 'General';
  }

  // browser approximation of the n8n readiness view, from cell rows (usable/unused optional)
  function computeReadinessFromRaw(raw){
    var groups = {};
    raw.forEach(function(r){
      var b = r.board || '\u2014', c = (r.class === null || r.class === undefined) ? '\u2014' : String(r.class),
          su = r.subject_code || '\u2014';
      (groups[b + '\u0001' + c + '\u0001' + su] = groups[b + '\u0001' + c + '\u0001' + su] || []).push(r);
    });
    function partsOf(rows){
      var o = {chapters:0, total:0, usable:0, fresh:0, hasFresh:true, ideal:0, cells:0, met:0, cap:Infinity,
               types:0, marks:0, diff:0, rot:0, de:0, dm:0, dh:0};
      var chaps = {}, cellsMap = {}, slotUs = {}, ppM = {};
      RD_SLOTS.forEach(function(sl){ o.ideal += sl.p * RD_GOALS.healthy; ppM[sl.m] = (ppM[sl.m] || 0) + sl.p; });
      rows.forEach(function(r){
        var u = rdUsable(r);
        o.total += toNum(r.count); o.usable += u;
        if (o.hasFresh){ var f = rdFresh(r); if (f === null) o.hasFresh = false; else o.fresh += f; }
        if (r.chapter_code) chaps[r.chapter_code] = 1;
        var d = rdNorm(r.difficulty_norm || r.difficulty), m = toNum(r.marks), qt = r.question_type || '';
        if (u && (d === 'easy' || d === 'medium' || d === 'hard')) o[d === 'easy' ? 'de' : d === 'medium' ? 'dm' : 'dh'] += u;
        var ck = r.chapter_code + '\u0001' + qt + '\u0001' + m + '\u0001' + d;
        cellsMap[ck] = (cellsMap[ck] || 0) + u;
        slotUs[qt + '\u0001' + m] = (slotUs[qt + '\u0001' + m] || 0) + u;
      });
      o.chapters = Object.keys(chaps).length;
      o.cells = o.chapters * RD_SLOTS.length * 3;
      RD_SLOTS.forEach(function(sl){
        Object.keys(chaps).forEach(function(c){
          ['easy','medium','hard'].forEach(function(d){
            if ((cellsMap[c + '\u0001' + sl.t + '\u0001' + sl.m + '\u0001' + d] || 0) >= sl.f) o.met++;
          });
        });
      });
      var tv = 0;
      RD_SLOTS.forEach(function(sl){
        var u = slotUs[sl.t + '\u0001' + sl.m] || 0;
        o.cap = Math.min(o.cap, Math.floor(u / sl.p));
        tv += Math.min(100, 100 * u / (sl.p * RD_GOALS.healthy));
      });
      o.types = tv / RD_SLOTS.length;
      var mkUs = {};
      rows.forEach(function(r){ mkUs[toNum(r.marks)] = (mkUs[toNum(r.marks)] || 0) + rdUsable(r); });
      var mSum = 0, mCnt = 0;
      Object.keys(ppM).forEach(function(m){ if (ppM[m] > 0){ mSum += Math.min(100, 100 * (mkUs[m] || 0) / (ppM[m] * RD_GOALS.healthy)); mCnt++; } });
      o.marks = mCnt ? mSum / mCnt : 0;
      if (!isFinite(o.cap)) o.cap = 0;
      o.diff = o.usable ? Math.max(0, 100 - (Math.abs(100*o.de/o.usable - RD_GOALS.de) + Math.abs(100*o.dm/o.usable - RD_GOALS.dm) + Math.abs(100*o.dh/o.usable - RD_GOALS.dh)) / 2) : 0;
      o.rot = (o.hasFresh && o.usable) ? Math.min(100, 100 * (o.fresh / o.usable) / (RD_GOALS.fresh / 100)) : null;
      return o;
    }
    function merged(partsList, lvl, board, cls, subj){
      var sum = function(k){ return partsList.reduce(function(a, p){ return a + p[k]; }, 0); };
      var avg = function(k){ var v = partsList.filter(function(p){ return p[k] != null; }); return v.length ? v.reduce(function(a, p){ return a + p[k]; }, 0) / v.length : null; };
      var o = sum('usable'), tot = sum('total'), ideal = sum('ideal');
      var cap = partsList.length ? Math.min.apply(null, partsList.map(function(p){ return p.cap; })) : 0;
      var curPct = sum('cells') ? 100 * sum('met') / sum('cells') : 0;
      var rot = avg('rot');
      var w = RD_W.cur + RD_W.marks + RD_W.types + RD_W.diff + (rot == null ? 0 : RD_W.rot);
      var score = (RD_W.cur * curPct + RD_W.marks * avg('marks') + RD_W.types * avg('types') + RD_W.diff * avg('diff') + (rot == null ? 0 : RD_W.rot * rot)) / w;
      var de = sum('de'), dm = sum('dm'), dh = sum('dh'), dsum = de + dm + dh;
      return {lvl: lvl, board: board, class: cls, subject_code: subj,
        stream: subj && subj !== '\u2014' ? rdStream(subj) : null,
        chapters: sum('chapters'), total: tot, usable: o,
        unused_usable: partsList.every(function(p){ return p.hasFresh; }) ? sum('fresh') : null,
        ideal_healthy: ideal, coverage_pct: ideal ? +(100 * o / ideal).toFixed(1) : 0,
        capacity_papers: cap,
        tier: cap >= RD_GOALS.strong ? 'strong' : cap >= RD_GOALS.healthy ? 'healthy' : cap >= RD_GOALS.viable ? 'viable' : 'not-ready',
        cells_total: sum('cells'), cells_met: sum('met'), zero_cells: null,
        curriculum_pct: +curPct.toFixed(1), marks_score: +(avg('marks') || 0).toFixed(1),
        types_score: +(avg('types') || 0).toFixed(1), difficulty_score: +(avg('diff') || 0).toFixed(1),
        rotation_score: rot == null ? null : +rot.toFixed(1), readiness: +score.toFixed(1),
        pct_easy: dsum ? +(100*de/dsum).toFixed(1) : 0, pct_medium: dsum ? +(100*dm/dsum).toFixed(1) : 0,
        pct_hard: dsum ? +(100*dh/dsum).toFixed(1) : 0};
    }
    var per = {}, byCls = {}, byBrd = {};
    Object.keys(groups).forEach(function(k){
      var pp = k.split('\u0001');
      var parts = partsOf(groups[k]);
      per[pp[0] + '|' + pp[1] + '|' + pp[2]] = parts;
      (byCls[pp[0] + '|' + pp[1]] = byCls[pp[0] + '|' + pp[1]] || []).push(parts);
      (byBrd[pp[0]] = byBrd[pp[0]] || []).push(parts);
    });
    var out = [];
    Object.keys(per).forEach(function(k){
      var pp = k.split('|');
      out.push(merged([per[k]], 'subject', pp[0], pp[1], pp[2]));
    });
    Object.keys(byCls).forEach(function(k){
      var pp = k.split('|');
      out.push(merged(byCls[k], 'class', pp[0], pp[1], null));
    });
    Object.keys(byBrd).forEach(function(b){
      out.push(merged(byBrd[b], 'board', b, null, null));
    });
    return out;
  }

  function readinessRows(){
    if (state.server.readiness && state.server.readiness.length) return state.server.readiness.slice();
    if (state.raw && state.raw.length) return computeReadinessFromRaw(state.raw);
    return computeReadinessFromRaw(state.rows);
  }
  function actionsRows(){
    if (state.server.actions && state.server.actions.length) return state.server.actions;
    var seen = {}, map = {};
    var src = (state.raw && state.raw.length) ? state.raw : state.rows;
    src.forEach(function(r){
      var d = rdNorm(r.difficulty_norm || r.difficulty);
      var k = (r.chapter_code || r.chapter_name || '') + '\u0001' + (r.question_type || '') + '\u0001' + toNum(r.marks) + '\u0001' + d;
      if (!seen[k]){ seen[k] = 1; map[k] = {r: r, usable: 0}; }
      map[k].usable += rdUsable(r);
    });
    var out = [];
    Object.keys(map).forEach(function(k){
      var e = map[k], r = e.r, slot = null;
      RD_SLOTS.forEach(function(sl){ if (sl.t === (r.question_type || '') && sl.m === toNum(r.marks)) slot = sl; });
      var u = e.usable;
      if (slot && u < slot.f) out.push({kind: u === 0 ? 'missing' : 'below_floor', chapter_code: r.chapter_code || r.chapter_name,
        question_type: slot.t, marks: slot.m, difficulty: k.split('\u0001')[3], usable: u, needed: slot.f,
        gap: slot.f - u, severity: u === 0 ? 'CRITICAL' : 'HIGH',
        recommendation: u === 0 ? 'ingest PYQ/Exemplar/SQP, human-verify' : 'generate ' + (slot.f - u) + ' more, human-verify'});
    });
    var rank = {CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3};
    out.sort(function(a, b){ return (rank[a.severity] - rank[b.severity]) || (b.gap - a.gap); });
    return out.slice(0, 20);
  }

  function tierChip(t){
    var cls = t === 'strong' || t === 'healthy' ? 'ok' : t === 'viable' ? 'warn' : 'bad';
    var ic  = t === 'strong' || t === 'healthy' ? '\ud83d\udfe2' : t === 'viable' ? '\ud83d\udfe1' : '\ud83d\udd34';
    return '<span class="chip ' + cls + '">' + ic + ' ' + esc(t) + '</span>';
  }
  function scoreBar(v){
    if (v === null || v === undefined) return '\u2014';
    var n = +v, cls = n < 40 ? 'bad' : n < 70 ? 'warn' : '';
    return '<span class="bar"><i class="' + cls + '" style="width:' + Math.round(n) + '%"></i></span> <b>' + n.toFixed(1) + '</b>';
  }
  function pctBar(v){
    if (v === null || v === undefined) return '\u2014';
    var n = +v;
    var cls = n < 40 ? 'bad' : n < 70 ? 'warn' : '';
    return '<span class="bar"><i class="' + cls + '" style="width:' + Math.min(100, Math.round(n)) + '%"></i></span> ' + n.toFixed(1) + '%';
  }
  function mixBar(r){
    var e = +r.pct_easy || 0, m = +r.pct_medium || 0, h = +r.pct_hard || 0, t = e + m + h;
    if (!t) return '\u2014';
    return '<span class="mix" title="easy ' + e + '% / medium ' + m + '% / hard ' + h + '%">' +
      '<i style="width:' + (100*e/t) + '%;background:#86efac"></i>' +
      '<i style="width:' + (100*m/t) + '%;background:#fde68a"></i>' +
      '<i style="width:' + (100*h/t) + '%;background:#fca5a5"></i></span>';
  }

  /* ---------------- Explorer: board → class → stream/subject → scope stats ---------------- */
  function srcRows(){ return (state.raw && state.raw.length) ? state.raw : state.rows; }
  function uniqArr(list){ var seen = {}, out = []; list.forEach(function(x){ x = String(x); if (!seen[x]){ seen[x] = 1; out.push(x); } }); return out; }
  function ckey(r){ return (r['class'] === null || r['class'] === undefined) ? '—' : String(r['class']); }
  function skey(r){ return r.subject_code || '—'; }
  function bkey(r){ return r.board || '—'; }
  function pushNav(o){ state._navq.push(o); return state._navq.length - 1; }
  function tierOf(cap){
    if (cap == null) return 'not-ready';
    return cap >= RD_GOALS.strong ? 'strong' : cap >= RD_GOALS.healthy ? 'healthy' : cap >= RD_GOALS.viable ? 'viable' : 'not-ready';
  }
  function scopeMatchNav(r){
    var n = state.nav;
    if (n.board && bkey(r) !== String(n.board)) return false;
    if (n.class && ckey(r) !== String(n.class)) return false;
    if (n.stream && (!r.subject_code || rdStream(r.subject_code) !== n.stream)) return false;
    if (n.subject && skey(r) !== String(n.subject)) return false;
    return true;
  }
  function statBox(l, v){
    return '<div class="stat"><div class="v">' + (v == null || v === '' ? '—' : v) + '</div><div class="l">' + esc(l) + '</div></div>';
  }
  function dimRow(label, v){
    if (v == null) return '<div class="dimb"><span class="dl">' + esc(label) + '</span><span class="db"></span><span class="dv">—</span></div>';
    var n = +v, col = n < 40 ? '#ef4444' : n < 70 ? '#f59e0b' : '#16a34a';
    return '<div class="dimb"><span class="dl">' + esc(label) + '</span><span class="db"><i style="width:' + Math.min(100, n) + '%;background:' + col + '"></i></span><span class="dv">' + n.toFixed(1) + '</span></div>';
  }
  function scopeCard(r, nav, title, subLabel, subVal){
    var cov = r ? (+r.coverage_pct || 0) : 0;
    var h = '<div class="scard" data-navq="' + pushNav(nav) + '"><div class="t">' + title + '</div>';
    if (r){
      h += '<div class="kv"><span>' + esc(subLabel) + '</span><b>' + subVal + '</b></div>';
      h += '<div class="kv"><span>Questions</span><b>' + r.total + '</b></div>';
      h += '<div class="kv"><span>Usable</span><b>' + r.usable + (r.ideal_healthy ? ' <span class="hint">of ' + r.ideal_healthy + '</span>' : '') + '</b></div>';
      h += '<div class="kv"><span>Coverage</span><b>' + cov.toFixed(1) + '%</b></div>';
      h += '<span class="bar" style="width:100%"><i class="' + (cov < 40 ? 'bad' : cov < 70 ? 'warn' : '') + '" style="width:' + Math.min(100, cov) + '%"></i></span>';
      h += '<div class="kv"><span>Capacity</span><b>' + (r.capacity_papers == null ? '—' : r.capacity_papers + ' 📄') + '</b></div>';
      h += '<div style="margin-top:9px;display:flex;justify-content:space-between;align-items:center">' + tierChip(r.tier) +
           '<span class="score">score ' + (r.readiness == null ? '—' : (+r.readiness).toFixed(1)) + '</span></div>';
    } else {
      h += '<div class="kv"><span>' + esc(subLabel) + '</span><b>' + subVal + '</b></div><div class="kv"><span>data</span><b>—</b></div>';
    }
    return h + '</div>';
  }
  function mergeRows(list, stream){
    if (!list.length) return null;
    if (list.length === 1) return Object.assign({}, list[0], {stream: list[0].stream || stream, lvl: 'stream'});
    var o = {lvl: 'stream', stream: stream, board: list[0].board, class: list[0].class};
    ['chapters','total','with_answer','usable','unused_usable','ideal_healthy','ideal_strong','cells_total','cells_met','zero_cells','cells_any']
      .forEach(function(k){
        var v = list.map(function(r){ return r[k]; }).filter(function(x){ return x != null; });
        o[k] = v.length ? v.reduce(function(a, b){ return a + (+b); }, 0) : null;
      });
    ['types_score','marks_score','difficulty_score','rotation_score','readiness','pct_easy','pct_medium','pct_hard','curriculum_pct']
      .forEach(function(k){
        var v = list.map(function(r){ return r[k]; }).filter(function(x){ return x != null; });
        o[k] = v.length ? +(v.reduce(function(a, b){ return a + (+b); }, 0) / v.length).toFixed(1) : null;
      });
    var caps = list.map(function(r){ return r.capacity_papers; }).filter(function(v){ return v != null; });
    o.capacity_papers = caps.length ? Math.min.apply(null, caps) : 0;
    o.coverage_pct = (o.ideal_healthy && o.usable != null) ? +(100 * o.usable / o.ideal_healthy).toFixed(1) : 0;
    o.tier = tierOf(o.capacity_papers);
    return o;
  }
  function renderExplorer(){
    var el = $('tab-explorer');
    state._navq = [];
    var n = state.nav;
    var rd = readinessRows();
    var boards = uniqArr(rd.filter(function(r){ return r.lvl === 'board'; }).map(function(r){ return r.board || '—'; }));
    if (!boards.length) boards = ['—'];
    var h = '';
    if (boards.length > 1 && !n.board){
      h += '<h2>Coverage explorer</h2>' +
        '<p class="rdnote">Tap a board → pick a class → pick a stream or subject. One number matters here: <b>how many complete papers this bank can generate</b>.</p><div class="cards">' +
        rd.filter(function(r){ return r.lvl === 'board'; }).map(function(r){
          return scopeCard(r, {board: r.board || '—'}, esc(r.board || '—') + ' <span class="hint">board →</span>', 'Classes',
                 rd.filter(function(x){ return x.lvl === 'class' && bkey(x) === bkey(r); }).length);
        }).join('') + '</div>';
      el.innerHTML = h; wireNav(el); return;
    }
    var board = n.board || boards[0];
    n.board = board;

  function wireBp(el){
    el.querySelectorAll('[data-bpcard]').forEach(function(b){
      b.addEventListener('click', function(){
        var nav = state._navq[+b.getAttribute('data-bpcard')];
        state.bpSel = nav.jumpBp; state.bpOpenSlot = null;
        renderBlueprint();
      });
    });
    el.querySelectorAll('[data-bpfilter]').forEach(function(sel){
      sel.addEventListener('change', function(){
        state.bpFilters[sel.getAttribute('data-bpfilter')] = sel.value;
        renderBlueprint();
      });
    });
    var clr = el.querySelector('[data-bpclearf]');
    if (clr) clr.addEventListener('click', function(){
      state.bpFilters = { question_type: '', marks: '', difficulty: '', cognitive: '', structure: '', diagram: '', review: '' };
      renderBlueprint();
    });
    el.querySelectorAll('[data-bpscale]').forEach(function(inp){
      var ev = inp.tagName === 'SELECT' ? 'change' : 'input';
      inp.addEventListener(ev, function(){
        state.bpScale[inp.getAttribute('data-bpscale')] = inp.value;
        renderBlueprint();
        var again = $('tab-bp').querySelector('[data-bpscale=\"marks\"]');
        if (again && ev === 'input'){ again.focus(); }
      });
    });
    el.querySelectorAll('.slrow').forEach(function(tr){
      tr.addEventListener('click', function(){
        var idx = +tr.getAttribute('data-slox');
        var cur = bpCurrent();
        var sid = cur && cur.cov && cur.cov.per_slot[idx] ? cur.cov.per_slot[idx].slot_id : null;
        state.bpOpenSlot = state.bpOpenSlot === sid ? null : sid;
        renderBlueprint();
      });
    });
  }

      'Where no blueprint exists, real inventory is still shown and targets read <b>unconfigured</b> — never invented. ' +
      'Eligibility = the same rule the generator uses (status valid/approved/imported AND a non-empty answer), so raw inventory, eligible counts and slot fill are always separate columns.</p>';
    if (!raws.length){
      h += '<div class="panel"><h3 style="margin-top:0">No blueprints loaded</h3>' +
